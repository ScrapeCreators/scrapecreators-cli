name: publish to npm

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: verify manual publish branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "manual publish must run from ${DEFAULT_BRANCH} (got ${GITHUB_REF_NAME})"
            exit 1
          fi

      - name: check package version
        id: package_version
        run: |
          PKG_NAME="$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).name)")"
          PKG_VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published; skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "${PKG_NAME}@${PKG_VERSION} is not published yet"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: install npm 12
        if: steps.package_version.outputs.should_publish == 'true'
        run: npm install -g npm@12

      - name: install dependencies
        if: steps.package_version.outputs.should_publish == 'true'
        run: npm ci

      - name: lockfile sync check
        if: steps.package_version.outputs.should_publish == 'true'
        run: npm run check:lockfile

      - name: audit dependencies
        if: steps.package_version.outputs.should_publish == 'true'
        run: npm audit --audit-level=high

      - name: run tests
        if: steps.package_version.outputs.should_publish == 'true'
        run: npm test

      - name: publish
        if: steps.package_version.outputs.should_publish == 'true'
        run: npm publish --access public --provenance
